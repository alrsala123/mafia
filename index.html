<!--
  ============================================================
  تنبيه مهم جداً قبل الرفع على الموقع (اقرأ هذا أولاً)
  ============================================================
  هذه اللعبة "أونلاين" فعلياً، بمعنى أن كل صديق يفتحها من جواله
  ويشوف نفس الحالة لحظة بلحظة. عشان يصير هذا التزامن بين الأجهزة
  لازم قاعدة بيانات حية بالخلفية، واستخدمنا Firebase Realtime
  Database لأنها مجانية وسهلة. خطوات التجهيز (٥ دقائق):

  1) روح لـ https://console.firebase.google.com وسجل دخول بحساب Google.
  2) أنشئ مشروع جديد (Create a project) بأي اسم.
  3) من القائمة الجانبية: Build > Realtime Database > Create Database
     اختر أي منطقة، وفي قواعد الأمان (Rules) اختر "Start in test mode".
  4) من القائمة الجانبية: Project settings (⚙️) > انزل لتحت "Your apps"
     واضغط أيقونة الويب </> لإنشاء تطبيق ويب، وسمّه أي اسم.
  5) بيطلعلك كائن firebaseConfig، انسخه وحط قيمه بدل القيم الموجودة
     تحت بالضبط في المتغير firebaseConfig (بحدود سطر ٤٠ بالكود).
  6) ارفع هذا الملف كما هو على موقعك، وشغّله، وشارك الرابط مع أصدقائك.

  ملاحظة: بما أن قاعدة البيانات هنا بدون تسجيل دخول (وضع اختبار)،
  اللعبة تعتمد على أمانة اللاعبين وعدم فتح أدوات المطوّر بالمتصفح.
  ============================================================
-->

<style>
  :root{
    --bg-deep:#0a0c16;
    --bg-panel:#141829;
    --bg-panel-2:#1c2138;
    --line:#2b3151;
    --text:#eae7dc;
    --text-dim:#9a9fbf;
    --gold:#c9a24b;
    --blood:#a3313d;
    --blood-bright:#d8434f;
    --citizen:#3f7a5c;
    --doctor:#2f6f95;
    --police:#5b5e86;
    --sheikh:#8a5f38;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #1a1f38 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, #22132a 0%, transparent 45%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:22px 18px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
  }
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 40px, #fff9, transparent),
      radial-gradient(1px 1px at 90px 120px, #fff7, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #fff8, transparent),
      radial-gradient(1px 1px at 220px 180px, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 300px 90px, #fff9, transparent),
      radial-gradient(1px 1px at 40px 220px, #fff7, transparent);
    background-repeat:repeat;
    background-size:340px 260px;
    opacity:.5;
  }
  h1.brand{
    font-family:'Amiri',serif;
    font-size:2.6rem;
    text-align:center;
    color:var(--gold);
    margin:10px 0 4px;
    letter-spacing:1px;
    text-shadow:0 0 22px rgba(201,162,75,.35);
  }
  .sub{ text-align:center; color:var(--text-dim); font-size:.92rem; margin-bottom:26px; }

  .card{
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.85rem; color:var(--text-dim); margin-bottom:7px; }
  input[type=text], input[type=number]{
    width:100%; padding:13px 14px; border-radius:12px;
    border:1px solid var(--line); background:#0e1224; color:var(--text);
    font-family:'Tajawal',sans-serif; font-size:1rem; outline:none;
  }
  input:focus{ border-color:var(--gold); }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
    background:#0e1224; color:var(--gold); font-size:1.2rem; cursor:pointer;
  }
  .stepper input{ text-align:center; flex:1; }

  .btn{
    display:block; width:100%; padding:15px 16px; border:none; border-radius:14px;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:1.05rem;
    cursor:pointer; text-align:center; transition:transform .12s ease, opacity .12s ease;
    color:#fff;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:linear-gradient(135deg,var(--blood-bright),var(--blood)); box-shadow:0 8px 22px rgba(163,49,61,.4);}
  .btn.gold{ background:linear-gradient(135deg,#e0bb66,var(--gold)); color:#1a1400; box-shadow:0 8px 22px rgba(201,162,75,.35);}
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
  .btn.small{ padding:10px 14px; font-size:.9rem; width:auto; display:inline-block; }
  .btn[disabled]{ opacity:.35; cursor:not-allowed; }
  .btn.block-outline{ background:#101425; border:1px solid var(--line); }

  .link{ color:var(--gold); text-decoration:underline; cursor:pointer; font-size:.9rem; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;

  .chip{

  .chip.dead{ opacity:.4; text-decoration:line-through; }
  .chip .role-dot{ width:8px; height:8px; border-radius:50%; }

  .count-badge{
    display:inline-block; background:var(--gold); color:#1a1400; font-weight:700;
    border-radius:20px; padding:2px 12px; font-size:.85rem;
  }

  .center-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  .big-emoji{ font-size:4rem; }
  .phase-title{ font-family:'Amiri',serif; font-size:1.7rem; color:var(--gold); }
  .phase-desc{ color:var(--text-dim); font-size:.95rem; max-width:320px; }

  .night-bg{ background:radial-gradient(circle at 50% 20%, #16204a 0%, #05060d 70%); border-radius:24px; padding:50px 20px; }
  .day-bg{ background:radial-gradient(circle at 50% 10%, #3a2d13 0%, #0a0c16 70%); border-radius:24px; padding:50px 20px; }

  .spin{ width:56px; height:56px; border:4px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .countdown-num{ font-family:'Amiri',serif; font-size:6rem; color:var(--gold); animation:pop .5s ease; text-shadow:0 0 30px rgba(201,162,75,.5);}
  .fade-in{ animation:fadeIn .35s ease; display:flex; flex-direction:column; flex:1; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes pop{ from{ transform:scale(.4); opacity:0;} to{ transform:scale(1); opacity:1;} }

  .role-card{
    perspective:1200px; width:100%; max-width:300px; height:390px; margin:10px auto;
  }
  .role-card-inner{
    position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .role-card.flipped .role-card-inner{ transform:rotateY(180deg); }
  .role-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:20px; border:1px solid var(--line);
  }
  .role-back{ background:linear-gradient(160deg,#1c2138,#0e1224); }
  .role-back .mask{ font-size:5rem; }
  .role-front{ transform:rotateY(180deg); color:#fff; text-align:center; }
  .role-front .icon{ font-size:4.2rem; }
  .role-front h2{ font-family:'Amiri',serif; font-size:1.9rem; margin:0; }
  .role-front p{ font-size:.9rem; opacity:.92; line-height:1.6; padding:0 10px; }

  .list-select{ display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .select-item{
    display:flex; align-items:center; justify-content:space-between;
    background:#0e1224; border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    cursor:pointer; transition:.15s;
  }
  .select-item.chosen{ border-color:var(--blood-bright); background:#1f1216; }
  .select-item.disabled{ opacity:.4; cursor:default; }
  .select-item .name{ font-weight:700; }
  .vote-count{ background:var(--blood); color:#fff; border-radius:20px; padding:3px 11px; font-size:.82rem; font-weight:700; }

  .timer-ring{ font-family:'Amiri',serif; font-size:3rem; color:var(--gold); }

  .banner{
    text-align:center; padding:18px; border-radius:16px; margin-bottom:16px; font-weight:700;
  }
  .banner.dead{ background:rgba(163,49,61,.18); border:1px solid var(--blood); color:#ff9aa4; }
  .banner.safe{ background:rgba(63,122,92,.18); border:1px solid var(--citizen); color:#a9e8c6; }

  footer.mini{ text-align:center; color:var(--text-dim); font-size:.75rem; margin-top:auto; padding-top:24px; }

  .setup-warn{ background:#2a1a1a; border:1px solid var(--blood); padding:16px; border-radius:14px; font-size:.85rem; line-height:1.9; }
  .setup-warn code{ background:#0e1224; padding:2px 6px; border-radius:6px; color:var(--gold); }
</style>

<script>
/* ==========================================================
   إعداد Firebase — استبدل القيم التالية بقيم مشروعك
   ========================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCOvWprb91hBsdPifTWnR_xxiFr5M6Ombc",
  authDomain: "mafi-386b9.firebaseapp.com",
  databaseURL: "https://mafi-386b9-default-rtdb.firebaseio.com",
  projectId: "mafi-386b9",
  storageBucket: "mafi-386b9.firebasestorage.app",
  messagingSenderId: "85321772206",
  appId: "1:85321772206:web:90dc7c48c6138b448fd13f",
  measurementId: "G-6WSETQVN8M"
};

const CONFIG_MISSING = firebaseConfig.apiKey.includes("ضع_مفتاحك");
let db = null;
if(!CONFIG_MISSING){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}

/* ================= Sound (Web Audio, synthesized) ================= */
const Sound = {
  ctx:null,
  ensure(){ if(!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } return this.ctx; },
  tone(freq,dur,type='sine',vol=.18,delay=0){
    try{
      const ctx=this.ensure();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.value=0;
      o.connect(g); g.connect(ctx.destination);
      const t0=ctx.currentTime+delay;
      g.gain.linearRampToValueAtTime(vol,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.start(t0); o.stop(t0+dur+0.05);
    }catch(e){}
  },
  click(){ this.tone(660,.08,'triangle',.12); },
  select(){ this.tone(440,.09,'sine',.14); },
  success(){ this.tone(523,.15,'sine',.15,0); this.tone(659,.18,'sine',.15,.1); this.tone(784,.25,'sine',.15,.2); },
  danger(){ this.tone(160,.5,'sawtooth',.15,0); this.tone(110,.6,'sawtooth',.12,.15); },
  reveal(){ this.tone(300,.3,'sine',.15,0); this.tone(450,.3,'sine',.15,.15); this.tone(600,.4,'sine',.15,.3); },
  tick(){ this.tone(880,.05,'square',.06); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.35,'triangle',.16,i*.13)); }
};
const Speech = {
  lastPhase:null,
  speak(text, force){
    if(!('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ar-SA'; u.rate=.92; u.pitch=1;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  once(key,text){
    if(this.lastPhase===key) return;
    this.lastPhase=key;
    this.speak(text);
  }
};
let _lastSoundKey=null;
function playOnce(key, fn){
  if(_lastSoundKey===key) return;
  _lastSoundKey=key;
  fn();
}
let _scheduled = {};
function scheduleOnce(key, fn, delay){
  if(_scheduled[key]) return;
  _scheduled[key] = true;
  setTimeout(()=>{ delete _scheduled[key]; fn(); }, delay);
}
let _executingFlag=false;

/* ================= Utilities ================= */
function uid(){ return 'p_'+Math.random().toString(36).slice(2,10); }
function roomCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function alivePlayers(room){ return Object.entries(room.players||{}).filter(([id,p])=>p.alive).map(([id,p])=>({id,...p})); }
function allPlayersArr(room){ return Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.order-b.order); }
function roleMeta(role){
  const map={
    'مافيا': {icon:'🔪', color:'var(--blood-bright)', desc:'مهمتك القضاء على المواطنين ليلاً دون أن يكتشفك أحد. تعاون مع رفاقك في المافيا سراً.'},
    'مواطن': {icon:'🧑‍🌾', color:'var(--citizen)', desc:'ليس لديك قدرات خاصة، لكن عقلك وحديثك في النهار هما سلاحك لكشف المافيا.'},
    'طبيب': {icon:'💉', color:'var(--doctor)', desc:'كل ليلة تختار شخصاً لتنقذه من محاولة اغتيال المافيا.'},
    'شرطي': {icon:'🕵️', color:'var(--police)', desc:'كل ليلة تحقق مع شخص لتعرف سراً إن كان من المافيا أم لا.'},
    'شيخ': {icon:'👁️', color:'var(--sheikh)', desc:'كل ليلة تكشف حقيقة دور شخص واحد لتزداد بصيرتك في اللعبة.'}
  };
  return map[role]||map['مواطن'];
}
function myPlayerId(){
  let id = localStorage.getItem('mafia_pid');
  if(!id){ id=uid(); localStorage.setItem('mafia_pid', id); }
  return id;
}

/* ================= App State ================= */
const S = {
  screen:'home', // home|join|room
  myId: myPlayerId(),
  myName: localStorage.getItem('mafia_name')||'',
  code: localStorage.getItem('mafia_room')||null,
  room:null,
  selection:null, // temp selection in a list
  cardFlipped:false,
};

function ref(path){ return db.ref(path); }

function goHome(){
  if(unsub){ unsub(); unsub=null; }
  S.screen='home'; S.code=null; S.room=null; localStorage.removeItem('mafia_room');
  render();
}

function persistRoom(code){ S.code=code; localStorage.setItem('mafia_room', code); }

/* -------- create / join -------- */
function createRoom(name){
  const code = roomCode();
  const now = Date.now();
  const room = {
    hostId: S.myId,
    phase: 'lobby',
    settings:{ citizens:4, mafia:1, doctor:false, police:false, sheikh:false },
    players:{ [S.myId]: { name, alive:true, order:0, role:null, ready:false, joinedAt:now } },
    round:1
  };
  ref('rooms/'+code).set(room).then(()=>{
    S.myName=name; localStorage.setItem('mafia_name',name);
    persistRoom(code);
    subscribeRoom(code);
  });
}

function joinRoom(code, name){
  code = code.trim().toUpperCase();
  ref('rooms/'+code).get().then(snap=>{
    if(!snap.exists()){ alert('لا توجد لعبة بهذا الكود'); return; }
    const room = snap.val();
    if(room.phase!=='lobby'){ alert('اللعبة بدأت بالفعل، لا يمكن الانضمام الآن'); return; }
    const order = Object.keys(room.players||{}).length;
    ref('rooms/'+code+'/players/'+S.myId).set({ name, alive:true, order, role:null, ready:false, joinedAt:Date.now() })
      .then(()=>{
        S.myName=name; localStorage.setItem('mafia_name',name);
        persistRoom(code);
        subscribeRoom(code);
      });
  });
}

let unsub=null;
function subscribeRoom(code){
  S.screen='room';
  if(unsub) unsub();
  const r = ref('rooms/'+code);
  const cb = snap=>{
    if(!snap.exists()){ goHome(); return; }
    S.room = snap.val();
    hostLogic();
    render();
  };
  r.on('value', cb);
  unsub = ()=>r.off('value',cb);
}

/* every visit starts at the home screen — no auto-rejoin of a previous game */
function tryReconnect(){
  localStorage.removeItem('mafia_room');
  render();
}

/* ================= Host-only automatic logic ================= */
function isHost(){ return S.room && S.room.hostId===S.myId; }

function hostLogic(){
  const room=S.room;
  if(!room) return;
  if(room.phase!=='confirm') _executingFlag=false;
  if(!isHost()) return;
  const phase = room.phase;
  const round = room.round||1;

  if(phase==='assigning'){
    scheduleOnce('assigning_'+round, ()=>{
      if(S.room && S.room.phase==='assigning') ref('rooms/'+S.code).update({ phase:'reveal_countdown', countdownStart: Date.now() });
    }, 1600);
  }

  if(phase==='reveal_countdown'){
    const elapsed = Date.now() - (room.countdownStart||Date.now());
    if(elapsed > 3400){
      ref('rooms/'+S.code+'/phase').set('reveal_role');
    }
  }

  // Night flow auto-advances so nobody has to sit waiting for a manual click.
  const doneMap = { mafia_turn:'mafiaDone', doctor_turn:'doctorDone', police_turn:'policeDone', sheikh_turn:'sheikhDone' };
  if(phase==='night_intro'){
    scheduleOnce('night_intro_'+round, ()=>{ if(S.room && S.room.phase==='night_intro') advanceNight(); }, 2600);
  }
  if(doneMap[phase] && room.night && room.night[doneMap[phase]]){
    scheduleOnce(phase+'_done_'+round, ()=>{ if(S.room && S.room.phase===phase) advanceNight(); }, 1500);
  }
  if(['mafia_close','doctor_close','police_close','sheikh_close'].includes(phase)){
    scheduleOnce(phase+'_'+round, ()=>{ if(S.room && S.room.phase===phase) advanceNight(); }, 2400);
  }

  if(phase==='voting'){
    const votesCast = Object.keys(room.votes||{}).length;
    if(votesCast>0 && votesCast>=alivePlayers(room).length){
      scheduleOnce('voting_close_'+round, ()=>{ if(S.room && S.room.phase==='voting') closeVoting(); }, 900);
    }
  }

  if(phase==='defense'){
    const elapsed = Date.now() - (room.defenseStart||Date.now());
    if(elapsed > 30000){
      moveToConfirm();
    }
  }

  if(phase==='confirm'){
    const confirmations = room.confirmations||{};
    const pending = alivePlayers(room).filter(p=>p.id!==room.accusedId && !confirmations[p.id]);
    if(pending.length===0 && !_executingFlag){
      _executingFlag = true;
      setTimeout(executeAccused, 400);
    }
  }
}

/* ================= Game flow actions (host driven writes) ================= */
function startGame(){
  const room=S.room;
  const players = allPlayersArr(room);
  const {citizens, mafia, doctor, police, sheikh} = room.settings;
  const specials = (doctor?1:0)+(police?1:0)+(sheikh?1:0);
  const total = citizens+mafia;
  if(players.length !== total){ alert('عدد اللاعبين المنضمين ('+players.length+') لا يساوي العدد المطلوب ('+total+')'); return; }
  if(specials > citizens){ alert('عدد الأدوار الخاصة أكبر من عدد المواطنين المتاح'); return; }
  let roles=[];
  for(let i=0;i<mafia;i++) roles.push('مافيا');
  if(doctor) roles.push('طبيب');
  if(police) roles.push('شرطي');
  if(sheikh) roles.push('شيخ');
  while(roles.length<total) roles.push('مواطن');
  roles = shuffle(roles);
  const updates={};
  players.forEach((p,i)=>{ updates['players/'+p.id+'/role']=roles[i]; updates['players/'+p.id+'/ready']=false; });
  updates['phase']='assigning';
  updates['night']=null;
  updates['votes']=null;
  updates['confirmations']=null;
  ref('rooms/'+S.code).update(updates);
}

function setReady(){
  ref('rooms/'+S.code+'/players/'+S.myId+'/ready').set(true);
  Sound.click();
}

function nightOrder(){ return ['mafia_turn','mafia_close','doctor_turn','doctor_close','police_turn','police_close','sheikh_turn','sheikh_close','day_reveal']; }

function roleAliveAndEnabled(room, roleName){
  const settingsKey = {'طبيب':'doctor','شرطي':'police','شيخ':'sheikh'}[roleName];
  if(settingsKey && !room.settings[settingsKey]) return false;
  return allPlayersArr(room).some(p=>p.role===roleName && p.alive);
}

function advanceNight(){
  const room=S.room;
  const seq = nightOrder();
  const turnRole = { mafia_turn:'مافيا', doctor_turn:'طبيب', police_turn:'شرطي', sheikh_turn:'شيخ' };
  const closeOf = { mafia_turn:'mafia_close', doctor_turn:'doctor_close', police_turn:'police_close', sheikh_turn:'sheikh_close' };
  let idx = seq.indexOf(room.phase);
  let next = seq[idx+1];
  // Skip an entire turn+close pair together when that role is disabled or dead,
  // instead of landing on a "closing eyes" screen for a role that never opened.
  while(next && turnRole[next] && !roleAliveAndEnabled(room, turnRole[next])){
    const closePhase = closeOf[next];
    idx = seq.indexOf(closePhase);
    next = seq[idx+1];
  }
  if(!next) next='day_reveal';
  if(next==='day_reveal'){ resolveNight(); return; }
  ref('rooms/'+S.code+'/phase').set(next);
}

function beginFirstNight(){
  ref('rooms/'+S.code).update({ phase:'night_intro', night:{} });
}

function mafiaConfirmKill(targetId){
  ref('rooms/'+S.code+'/night').update({ mafiaTarget: targetId, mafiaActorId:S.myId, mafiaDone:true });
  Sound.danger();
}
function doctorConfirmHeal(targetId){
  ref('rooms/'+S.code+'/night').update({ doctorTarget: targetId, doctorDone:true });
  Sound.success();
}
function policeConfirmCheck(targetId){
  const target = S.room.players[targetId];
  ref('rooms/'+S.code+'/night').update({ policeTarget: targetId, policeResult: target.role==='مافيا', policeDone:true });
  Sound.select();
}
function sheikhConfirmReveal(targetId){
  const target = S.room.players[targetId];
  ref('rooms/'+S.code+'/night').update({ sheikhTarget: targetId, sheikhResult: target.role, sheikhDone:true });
  Sound.select();
}

function resolveNight(){
  const room=S.room;
  const night = room.night||{};
  const killedId = (night.mafiaTarget && night.mafiaTarget!==night.doctorTarget) ? night.mafiaTarget : null;
  const updates={ phase:'day_reveal', 'night/killed': killedId===null? 'none': killedId };
  if(killedId){ updates['players/'+killedId+'/alive']=false; }
  ref('rooms/'+S.code).update(updates).then(checkWinAfter);
}

function checkWinAfter(){
  setTimeout(()=>{
    const room=S.room;
    if(!room) return;
    const players = allPlayersArr(room);
    const aliveMafia = players.filter(p=>p.role==='مافيا' && p.alive).length;
    const aliveOthers = players.filter(p=>p.role!=='مافيا' && p.alive).length;
    if(aliveMafia===0){ ref('rooms/'+S.code).update({phase:'game_over', winner:'citizens'}); }
    else if(aliveMafia>=aliveOthers){ ref('rooms/'+S.code).update({phase:'game_over', winner:'mafia'}); }
  }, 300);
}

function goToVoting(){
  ref('rooms/'+S.code).update({ phase:'voting', votes:{} });
}

function castVote(targetId){
  ref('rooms/'+S.code+'/votes/'+S.myId).set(targetId);
  Sound.tick();
}

function closeVoting(){
  const room=S.room;
  const votes = room.votes||{};
  if(Object.keys(votes).length===0){ alert('لا يوجد أي صوت بعد، انتظر حتى يصوّت أحدهم'); return; }
  const tally={};
  Object.values(votes).forEach(t=>{ tally[t]=(tally[t]||0)+1; });
  const max = Math.max(...Object.values(tally));
  const tiedIds = Object.keys(tally).filter(id=>tally[id]===max);
  // deterministic tie-break: earliest player to join among the tied
  const top = allPlayersArr(room).filter(p=>tiedIds.includes(p.id)).sort((a,b)=>a.order-b.order)[0].id;
  ref('rooms/'+S.code).update({ phase:'defense', accusedId:top, defenseStart:Date.now() });
}

function moveToConfirm(){
  ref('rooms/'+S.code).update({ phase:'confirm', confirmations:{} });
}

function confirmExecution(){
  ref('rooms/'+S.code+'/confirmations/'+S.myId).set(true);
  Sound.click();
}

function executeAccused(){
  const room=S.room;
  const id = room.accusedId;
  ref('rooms/'+S.code+'/players/'+id+'/alive').set(false).then(()=>{
    Sound.reveal();
    setTimeout(()=>{
      const r=S.room;
      const players = allPlayersArr(r);
      const aliveMafia = players.filter(p=>p.role==='مافيا' && p.alive).length;
      const aliveOthers = players.filter(p=>p.role!=='مافيا' && p.alive).length;
      if(aliveMafia===0){ ref('rooms/'+S.code).update({phase:'game_over', winner:'citizens'}); }
      else if(aliveMafia>=aliveOthers){ ref('rooms/'+S.code).update({phase:'game_over', winner:'mafia'}); }
      else{
        ref('rooms/'+S.code).update({ phase:'night_intro', night:{}, votes:null, confirmations:null, round:(r.round||1)+1, accusedId:null });
      }
    }, 2200);
  });
}

function resetToLobby(){
  const room=S.room;
  const updates={ phase:'lobby', night:null, votes:null, confirmations:null, winner:null, accusedId:null, round:1 };
  Object.keys(room.players||{}).forEach(pid=>{
    updates['players/'+pid+'/alive']=true;
    updates['players/'+pid+'/role']=null;
    updates['players/'+pid+'/ready']=false;
  });
  ref('rooms/'+S.code).update(updates);
}

function actorTurnRenderer(opts){
  const room=S.room;
  const me = room.players[S.myId];
  const isRole = me.role===opts.role && me.alive;
  Speech.once(opts.speechKey, opts.speechText);
  const done = room.night && room.night[opts.doneFlag];
  const hostBtn = isHost()
    ? `<button class="btn ghost" data-action="advanceNight" ${(!done && roleAliveAndEnabled(room, opts.role)) ?'disabled':''} style="margin-top:14px;">تخطي / متابعة ⏭</button>`
    : '';
  if(!isRole){
    return `<div class="night-bg center-col" style="min-height:70vh;">
      <div class="big-emoji">🌙</div>
      <div class="phase-title">${opts.othersMsg}</div>
      ${hostBtn}
    </div>`;
  }
  const candidates = alivePlayers(room).filter(p=> opts.excludeSelf ? p.id!==S.myId : true);
  // determine if I'm the sole actor (for mafia with multiple members, only earliest 'order' acts)
  let iAmActor = true;
  if(opts.singleActorAmongRole){
    const roleMembers = alivePlayers(room).filter(p=>p.role===opts.role).sort((a,b)=>a.order-b.order);
    iAmActor = roleMembers.length && roleMembers[0].id===S.myId;
  }
  const chosenId = room.night && room.night[opts.targetField];
  let resultLine='';
  if(opts.resultField && room.night && room.night[opts.resultField]!==undefined && done){
    resultLine = `<div class="banner ${room.night[opts.resultField]===true?'dead':'safe'}">${opts.resultLabel(room.night[opts.resultField])}</div>`;
  }
  return `<div class="night-bg" style="min-height:70vh;">
    <div class="center-col" style="margin-bottom:6px;">
      <div class="big-emoji">${opts.icon}</div>
      <div class="phase-title">${opts.title}</div>
      <div class="phase-desc">${iAmActor ? opts.instruction : 'زميلك يختار الآن...'}</div>
    </div>
    ${resultLine}
    <div class="list-select">
      ${candidates.map(p=>`
        <div class="select-item ${(!iAmActor||done)?'disabled':''} ${S.selection===p.id?'chosen':''}" ${(!iAmActor||done)?'':`data-action="pick" data-id="${p.id}"`}>
          <span class="name">${p.name}</span>
          ${chosenId===p.id?'<span>🎯</span>':''}
        </div>`).join('')}
    </div>
    ${iAmActor && !done ? `<button class="btn primary" data-action="confirmAction" data-role="${opts.role}" ${S.selection?'':'disabled'}>${opts.confirmLabel}</button>` : ''}
    ${hostBtn}
  </div>`;
}

    othersMsg:'الشيخ يكشف حقيقة أحدهم الآن...',
    instruction:'اختر شخصاً لتكشف دوره الحقيقي',
    confirmLabel:'👁️ كشف الدور',
    excludeSelf:true, singleActorAmongRole:false,
    doneFlag:'sheikhDone', targetField:'sheikhTarget',
    resultField:'sheikhResult', resultLabel:(v)=> `👁️ دوره الحقيقي: ${v}`
  });
}

function renderDayReveal(){
  const room=S.room;
  const killedId = room.night && room.night.killed;
  Speech.once('day_'+(room.round||1), 'الجميع يفتح عينيه');
  let banner;
  if(killedId && killedId!=='none'){
    const p = room.players[killedId];
    banner = `<div class="banner dead">💀 توفي الليلة: ${p.name} — كان دوره: ${p.role}</div>`;
  }else{
    banner = `<div class="banner safe">☀️ نجا الجميع الليلة الماضية!</div>`;
  }
  return `<div class="day-bg" style="min-height:70vh;">
    <div class="center-col">
      <div class="big-emoji">☀️</div>
      <div class="phase-title">الصباح الجولة ${room.round||1}</div>
    </div>
    ${banner}
    ${isHost() ? `<button class="btn primary" data-action="goVoting">🗳️ بدء التصويت</button>` : `<div class="phase-desc" style="text-align:center;">بانتظار المضيف لبدء التصويت...</div>`}
  </div>`;
}

function renderVoting(){
  const room=S.room;
  const players = alivePlayers(room);
  const votes = room.votes||{};
  const tally={};
  Object.values(votes).forEach(t=>{ tally[t]=(tally[t]||0)+1; });
  const myVote = votes[S.myId];
  const totalVotes = Object.keys(votes).length;
  return `
  <h1 class="brand" style="font-size:1.7rem;">🗳️ التصويت</h1>
  <div class="sub">صوّتوا لإخراج من تشتبهون به من اللعبة</div>
  <div class="list-select">
    ${players.filter(p=>p.id!==S.myId).map(p=>`
      <div class="select-item ${myVote===p.id?'chosen':''}" data-action="vote" data-id="${p.id}">
        <span class="name">${p.name}</span>
        <span class="vote-count">${tally[p.id]||0}</span>
      </div>`).join('')}
  </div>
  <div class="phase-desc" style="text-align:center;">صوّت حتى الآن: ${totalVotes} / ${players.length}</div>
  ${isHost() ? `<button class="btn primary" data-action="closeVoting">🔒 إغلاق التصويت</button>` : ''}
  `;
}

function renderDefense(){
  const room=S.room;
  const accused = room.players[room.accusedId];
  const elapsed = Date.now()-(room.defenseStart||Date.now());
  const remaining = Math.max(0, 30-Math.floor(elapsed/1000));
  setTimeout(render,500);
  const isMe = room.accusedId===S.myId;
  Speech.once('defense_'+room.accusedId, accused.name+' لديه فرصة للدفاع عن نفسه');
  return `<div class="center-col" style="min-height:70vh;">
    <div class="big-emoji">🎤</div>
    <div class="phase-title">${isMe? 'دورك للدفاع عن نفسك!' : accused.name+' يدافع عن نفسه'}</div>
    <div class="phase-desc">${isMe? 'تحدث الآن أمام الجميع وحاول إقناعهم' : 'استمعوا جيداً...'}</div>
    <div class="timer-ring">${remaining}</div>
    ${isHost() ? `<button class="btn ghost" data-action="skipDefense">تخطي ⏭</button>` : ''}
  </div>`;
}

function renderConfirm(){
  const room=S.room;
  const accused = room.players[room.accusedId];
  const confirmations = room.confirmations||{};
  const alivePl = alivePlayers(room).filter(p=>p.id!==room.accusedId);
  const confirmedCount = alivePl.filter(p=>confirmations[p.id]).length;
  const pending = alivePl.filter(p=>!confirmations[p.id]).map(p=>p.name);
  const iConfirmed = !!confirmations[S.myId];
  return `<div class="center-col" style="min-height:70vh;">
    <div class="big-emoji">⚖️</div>
    <div class="phase-title">هل توافقون على إخراج ${accused.name}؟</div>
    <button class="btn primary" data-action="confirmExec" ${iConfirmed||room.accusedId===S.myId?'disabled':''}>${iConfirmed?'✅ تم الاعتماد':'اعتمدت'}</button>
    <div class="phase-desc">اعتمد ${confirmedCount} / ${alivePl.length}${pending.length?'<br>بانتظار: '+pending.join('، '):''}</div>
  </div>`;
}

function renderGameOver(){
  const room=S.room;
  const players = allPlayersArr(room);
  const win = room.winner;
  Speech.once('gameover_'+win, win==='mafia' ? 'فازت المافيا' : 'فاز المواطنون');
  playOnce('sound_gameover_'+S.code+'_'+win, ()=>{ win==='citizens' ? Sound.fanfare() : Sound.danger(); });
  return `
  <div class="center-col" style="min-height:40vh;">
    <div class="big-emoji">${win==='mafia'?'🕶️':'🎉'}</div>
    <div class="phase-title" style="font-size:2rem;">${win==='mafia'?'فازت المافيا!':'فاز المواطنون!'}</div>
  </div>
  <div class="card">
    <b>كشف جميع الأدوار:</b>
    <div class="players-grid" style="margin-top:12px;">
      ${players.map(p=>{
        const meta=roleMeta(p.role);
        return `<div class="chip ${!p.alive?'dead':''}"><span class="role-dot" style="background:${meta.color}"></span>${p.name} — ${p.role}</div>`;
      }).join('')}
    </div>
  </div>
  ${isHost() ? `<button class="btn gold" data-action="resetLobby">🔁 لعبة جديدة (نفس المجموعة)</button>` : ''}
  <button class="btn ghost" data-action="leaveHome" style="margin-top:10px;">الخروج للرئيسية</button>
  `;
}

/* ================= Event handling ================= */
function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const key = el.getAttribute('data-toggle');
      ref('rooms/'+S.code+'/settings/'+key).set(el.checked);
      Sound.click();
    });
  });
}

appEl.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  Sound.click();
  switch(action){
    case 'goJoin': S.screen='join'; render(); break;
    case 'goHome': S.screen='home'; render(); break;
    case 'leaveHome': goHome(); break;
    case 'confirmLeave': {
      if(confirm('هل تريد الخروج من اللعبة الحالية والعودة للرئيسية؟')) goHome();
      break;
    }
    case 'create': {
      const name = document.getElementById('hostName').value.trim();
      if(!name){ alert('اكتب اسمك أولاً'); return; }
      createRoom(name);
      break;
    }
    case 'join': {
      const code = document.getElementById('joinCode').value.trim();
      const name = document.getElementById('joinName').value.trim();
      if(!code||!name){ alert('أدخل الكود والاسم'); return; }
      joinRoom(code,name);
      break;
    }
    case 'inc-citizens': ref('rooms/'+S.code+'/settings/citizens').set(S.room.settings.citizens+1); break;
    case 'dec-citizens': if(S.room.settings.citizens>0) ref('rooms/'+S.code+'/settings/citizens').set(S.room.settings.citizens-1); break;
    case 'inc-mafia': ref('rooms/'+S.code+'/settings/mafia').set(S.room.settings.mafia+1); break;
    case 'dec-mafia': if(S.room.settings.mafia>1) ref('rooms/'+S.code+'/settings/mafia').set(S.room.settings.mafia-1); break;
    case 'start': startGame(); break;
    case 'flipCard': S.cardFlipped=!S.cardFlipped; Sound.reveal(); render(); break;
    case 'ready': setReady(); break;
    case 'beginNight': beginFirstNight(); break;
    case 'advanceNight': advanceNight(); break;
    case 'pick': S.selection = t.getAttribute('data-id'); render(); break;
    case 'confirmAction': {
      const role = t.getAttribute('data-role');
      if(!S.selection) return;
      if(role==='مافيا') mafiaConfirmKill(S.selection);
      else if(role==='طبيب') doctorConfirmHeal(S.selection);
      else if(role==='شرطي') policeConfirmCheck(S.selection);
      else if(role==='شيخ') sheikhConfirmReveal(S.selection);
      S.selection=null;
      break;
    }
    case 'goVoting': goToVoting(); break;
    case 'vote': castVote(t.getAttribute('data-id')); break;
    case 'closeVoting': closeVoting(); break;
    case 'skipDefense': moveToConfirm(); break;
    case 'confirmExec': confirmExecution(); break;
    case 'resetLobby': resetToLobby(); break;
  }
});

/* init */
tryReconnect();
</script>
</body>
</html>
